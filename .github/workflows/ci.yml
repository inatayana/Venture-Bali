name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Lint, Typecheck, Test, Build, Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Design token contrast
        run: npm run check:contrast

      - name: Theme utility guard
        run: npm run check:theme

      - name: Test
        run: npm test -- --ci

      - name: Dependency audit
        run: npm run audit:check

      - name: Build
        run: npm run build
