name: E2E

on:
  pull_request:
    branches: [main]

jobs:
  money-path:
    name: Money-path E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baliwild_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baliwild_e2e?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/baliwild_e2e?schema=public
      MIDTRANS_SERVER_KEY: test-server-key
      MIDTRANS_CLIENT_KEY: test-client-key
      MIDTRANS_IS_PRODUCTION: 'false'
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3300
      ADMIN_SESSION_SECRET: e2e-admin-session-secret-32-chars
      CUSTOMER_LINK_SECRET: e2e-customer-link-secret-32-chars
      CRON_SECRET: e2e-cron-secret-32-chars
      BOOKING_HOLD_MINUTES: '10'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run money-path E2E
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
